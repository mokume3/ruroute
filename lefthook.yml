pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,js,json,jsonc,yml,yaml}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm typecheck

pre-push:
  parallel: true
  jobs:
    - name: test
      run: pnpm test:coverage
    - name: knip
      run: pnpm knip
    - name: treeshake
      run: pnpm check:treeshake
    - name: type-perf
      run: pnpm check:type-perf
